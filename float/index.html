    <section class="f-facts" aria-label="만든 방법">
      <h2>이렇게 움직여요</h2>
      <ul>
        <li><b>깊이감</b>스티커마다 깊이 값이 달라서, 마우스를 움직이면 가까운 것이 더 많이 따라와요.</li>
        <li><b>스프링</b>끌어서 놓으면 속도를 이어받아 출렁이다 제자리로 돌아와요.</li>
        <li><b>스크롤</b>아래로 내리면 스티커가 흩어지며 글자만 남아요.</li>
      </ul>
