<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>링 갤러리 · 몰입형 3D 스크롤 | 보람찬크루 쇼케이스</title>
  <meta name="description" content="카드 링, 나선, 지구본, 부채꼴. 스크롤이 곧 회전인 CSS 3D 갤러리 데모.">
  <meta name="robots" content="noindex, nofollow, noimageindex, noarchive">
  <meta name="theme-color" content="#f4f2ee">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="icon" href="../favicon.ico" sizes="48x48">
  <link rel="stylesheet" href="assets/css/main.css?v=202611122047">
  <script type="module" src="assets/js/main.js?v=202611122047"></script>
  <link rel="stylesheet" href="../assets/css/demo-frame.css?v=202611122047">
</head>
<body>
  <a class="u-visually-hidden" href="#main">본문 바로가기</a>
  <header class="l-bar">
    <a class="l-bar__back" href="../lab.html">← 쇼케이스</a>
    <p class="l-bar__label" aria-hidden="true"><span class="js-no">01</span> / 04 <span class="l-bar__name js-name">RING</span></p>
    <p class="l-bar__hint" aria-hidden="true">스크롤 ↓</p>
  </header>
  <div class="l-bar__line" aria-hidden="true"><span class="l-bar__fill"></span></div>

  <main class="s-run s-run--ring" id="main" style="--n:4" data-module="scenes" data-steps="4" data-names="RING,HELIX,GLOBE,FAN">
    <div class="s-stage">
      <section class="s-scene s-scene--a1 is-on" data-name="RING" aria-labelledby="r1">
        <div class="s-3d" aria-hidden="true"><div class="s-world s-world--ring js-ring"></div></div>
        <div class="s-copy">
          <p class="s-eyebrow">링 갤러리 · 쇼케이스</p>
          <h1 class="s-title" id="r1">TURN<br>THE RING</h1>
          <p class="s-lead">열두 장의 카드가 둘러선 링. 스크롤하는 만큼 돌아갑니다.</p>
        </div>
      </section>
      <section class="s-scene s-scene--a2" data-name="HELIX" aria-labelledby="r2">
        <div class="s-3d" aria-hidden="true"><div class="s-world s-world--helix js-helix"></div></div>
        <div class="s-copy s-copy--right s-copy--light">
          <h2 class="s-title s-title--sm" id="r2">CLIMB THE<br>HELIX</h2>
          <p class="s-lead">카드가 나선으로 이어져, 돌면서 위로 올라갑니다.</p>
        </div>
      </section>
      <section class="s-scene s-scene--a3" data-name="GLOBE" aria-labelledby="r3">
        <div class="s-3d" aria-hidden="true"><div class="s-world s-world--globe js-globe"></div></div>
        <div class="s-copy s-copy--light">
          <h2 class="s-title s-title--sm" id="r3">A WORLD<br>OF DOTS</h2>
          <p class="s-lead">점 백십 개로 만든 지구본. 도시 핀은 앞면에서만 보여요.</p>
        </div>
      </section>
      <section class="s-scene s-scene--a4" data-name="FAN" aria-labelledby="r4">
        <div class="s-fan js-fan" aria-hidden="true"></div>
        <div class="s-copy s-copy--center s-copy--top">
          <h2 class="s-title s-title--sm" id="r4">PICK<br>A CARD</h2>
          <a class="s-btn s-btn--dark" href="flight.html">다음 쪽: 비행</a>
        </div>
      </section>
    </div>
  </main>
  <script src="../assets/js/demo-frame.js?v=202611122047" data-demo="immersive/ring"></script>
</body>
</html>
